('parent missing')}this.n.set(p,{t:'d',m:'0755',time:now()})},write(p,d,app=false){p=this.norm(p);if(!this.has(this.par(p)))throw Error('no such directory');const o=this.stat(p);this.n.set(p,{t:'f',m:o?.m||'0644',time:now(),d:app&&o?.t=='f'?o.d+String(d):String(d)})},read(p){const n=this.stat(p);if(!n)throw Error('no such file');if(n.t!='f')throw Error('is a directory');return n.d},list(p){p=this.norm(p);const n=this.stat(p);if(!n)throw Error('not found');if(n.t=='f')return[this.base(p)];const pre=p=='/'?'/':p+'/',s=new Set;for(const k of this.n.keys())if(k.startsWith(pre)&&k!=p){const r=k.slice(pre.length);if(r&&!r.includes('/'))s.add(r)}return[...s].sort()},rm(p,r=false){p=this.norm(p);if(p=='/')throw Error('refusing /');const n=this.stat(p);if(!n)throw Error('not found');const c=[...this.n.keys()].filter(k=>k.startsWith(p+'/'));if(n.t=='d'&&c.length&&!r)throw Error('directory not empty');c.forEach(k=>this.n.delete(k));this.n.delete(p)}};function fresh(){FS.n.clear();FS.n.set('/',{t:'d',m:'0755',time:now()});['/bin','/boot','/dev','/etc','/home','/home/user','/lib','/media','/mnt','/opt','/proc','/root','/run','/sbin','/srv','/sys','/tmp','/usr','/usr/bin','/usr/lib','/usr/local','/usr/local/bin','/var','/var/lib','/var/lib/pkg','/var/log'].forEach(x=>FS.mkdir(x,true));FS.write('/etc/os-release','NAME=POSIX.js\nID=posixjs\nPRETTY_NAME="POSIX.js Browser Linux Environment"\nVERSION=2\n');FS.write('/etc/hostname','posixjs\n');FS.write('/etc/passwd','root:x:0:0:root:/root:/bin/sh\nuser:x:1000:1000:Browser User:/home/user:/bin/sh\n');FS.write('/etc/hosts','127.0.0.1 localhost posixjs\n');FS.write('/etc/fstab','indexeddbfs / idbfs rw 0 0\ntmpfs /tmp tmpfs rw 0 0\n');FS.write('/etc/motd','POSIX.js Browser Linux Environment\nPersistent IndexedDB filesystem enabled.\n');FS.write('/home/user/README','POSIX.js\nTry: help, ls /, cat /etc/os-release, pkg list, top, startx\n');FS.write('/home/user/demo.sh','#!/bin/sh\necho Hello from POSIX.js\nmkdir -p /tmp/demo\necho persisten
