<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>POSIX.js</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#d8d8d8;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}body{display:flex;flex-direction:column}#o{flex:1;overflow:auto;padding:14px;white-space:pre-wrap;line-height:1.5}.i{display:flex;padding:9px 14px}.p{color:#5ee47c;margin-right:7px;white-space:nowrap}input{min-width:0;flex:1;background:transparent;color:inherit;border:0;outline:0;font:inherit}@media(max-width:600px){#o{padding:11px}.i{padding:9px 11px}}</style></head><body><div id="o"></div><div class="i"><span class="p" id="p"></span><input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></div><script>(()=>{'use strict';const O=document.querySelector('#o'),I=document.querySelector('#c'),P=document.querySelector('#p'),N=new Map;let cwd='/home/user',H=[],h=0;const out=s=>{O.textContent+=String(s??'')+'\n';O.scrollTop=O.scrollHeight},norm=p=>{p=p||cwd;if(p[0]=='~')p='/home/user'+p.slice(1);if(p[0]!='/')p=cwd+'/'+p;let a=[];for(let x of p.split('/'))if(x&&x!='.')x=='..'?a.pop():a.push(x);return'/'+a.join('/')},prompt=()=>P.textContent='user@posixjs:'+cwd.replace('/home/user','~')+'$';function md(p){p=norm(p);if(N.has(p))return;let q=p.split('/').slice(0,-1).join('/')||'/';if(!N.has(q))md(q);N.set(p,{t:'d',time:Date.now()})}function wr(p,d=''){p=norm(p);md(p.split('/').slice(0,-1).join('/')||'/');N.set(p,{t:'f',d:String(d),time:Date.now()})}function init(){N.clear();N.set('/',{t:'d'});['/bin','/etc','/etc/apk','/home','/home/user','/tmp','/usr','/usr/bin','/var','/var/cache','/var/cache/apk'].forEach(md);wr('/etc/os-release','NAME=POSIX.js\nVERSION=5\nARCH=riscv64\n');wr('/etc/hostname','posixjs\n');wr('/etc/apk/repositories','/alpine/main\n/alpine/community\n');wr('/home/user/README','POSIX.js\nType help.\n')}const DB='posixjs5';function db(){return new Promise((y,n)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('fs');r.onsuccess=()=>y(r.result);r.onerror=()=>n(r.error)})}async function save(){let d=await db();return new Promise((y,n)=>{let t=d.transaction('fs','readwrite'),s=t.objectStore('fs');s.put([...N],'n');s.put(cwd,'cwd');t.oncomplete=y;t.onerror=()=>n(t.error)})}async function load(){try{let d=await db();return await new Promise(y=>{let t=d.transaction('fs'),s=t.objectStore('fs'),a=s.get('n'),b=s.get('cwd');t.oncomplete=()=>y([a.result,b.result])})}catch{return null}}function ls(p='.'){p=norm(p);let n=N.get(p);if(!n)throw Error('No such file or directory');if(n.t=='f')return[p.split('/').pop()];let q=p=='/'?'/':p+'/';return[...new Set([...N.keys()].filter(k=>k.startsWith(q)&&k!=p).map(k=>k.slice(q.length).split('/')[0]).filter(Boolean))].sort()}async function net(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r}async function apk(a){let s=a.shift()||'help';if(s=='arch')return out('riscv64');if(s=='repositories')return out('/alpine/main\n/alpine/community');if(s=='update'){let z=0;for(let repo of['main','community']){let u='/alpine/'+repo+'/riscv64/APKINDEX.tar.gz';out('fetch '+u);try{let r=await net(u),b=new Uint8Array(await r.arrayBuffer());N.set('/var/cache/apk/'+repo+'.tar.gz',{t:'b',d:b,time:Date.now()});out('OK '+repo+' '+b.length+' bytes');z++}catch(e){out('ERROR '+repo+': '+e.message)}}out(z==2?'OK: repositories updated':'ERROR: mirror unavailable');return}out('apk: update | arch | repositories')}async function run(line){let a=line.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g)||[];a=a.map(x=>x.replace(/^['"]|['"]$/g,''));if(!a.length)return;let c=a.shift();try{if(c=='help')out('cat cd clear cp date df echo env find free head help hostname id ls mkdir mv apk pwd reboot rm rmdir sync tail touch uname uptime wc whoami curl');else if(c=='clear')O.textContent='';else if(c=='pwd')out(cwd);else if(c=='cd'){let p=norm(a[0]||'~');if(N.get(p)?.t!='d')throw Error('not a directory');cwd=p}else if(c=='ls')out(ls(a[0]||'.').join('  '));else if(c=='cat'){for(let p of a){let n=N.get(norm(p));if(!n)throw Error('no such file');if(n.t!='f')throw Error('not a text file');out(n.d)}}else if(c=='echo')out(a.join(' '));else if(c=='mkdir')a.forEach(md);else if(c=='touch')a.forEach(p=>wr(p,N.get(norm(p))?.d||''));else if(c=='rm'||c=='rmdir'){for(let p of a){p=norm(p);for(let k of[...N.keys()])if(k==p||k.startsWith(p+'/'))N.delete(k)}}else if(c=='cp'){let n=N.get(norm(a[0]));if(!n||n.t!='f')throw Error('source not file');wr(a[1],n.d)}else if(c=='mv'){let p=norm(a[0]),q=norm(a[1]),n=N.get(p);if(!n)throw Error('not found');N.set(q,n);N.delete(p)}else if(c=='hostname')out('posixjs');else if(c=='whoami')out('user');else if(c=='id')out('uid=1000(user) gid=1000(user) groups=1000(user)');else if(c=='uname')out(a.includes('-a')?'Linux posixjs 6.6-posixjs riscv64 POSIX.js':'Linux');else if(c=='date')out(new Date().toString());else if(c=='uptime')out('up '+Math.floor(performance.now()/60000)+' min');else if(c=='env')out('HOME=/home/user\nUSER=user\nSHELL=/bin/sh\nPATH=/bin:/usr/bin\nTERM=xterm-256color');else if(c=='df')out('Filesystem      Size  Used Avail Use% Mounted on\nindexeddb       browser persistent storage /');else if(c=='free')out('              total        used        free\nMem:        browser-managed');else if(c=='head'||c=='tail'){let n=N.get(norm(a.at(-1)));if(!n||n.t!='f')throw Error('not a file');let x=n.d.split('\n'),k=10;out((c=='head'?x.slice(0,k):x.slice(-k)).join('\n'))}else if(c=='wc'){let n=N.get(norm(a.at(-1)));if(!n||n.t!='f')throw Error('not a file');let x=n.d;out(x.split('\n').length+' '+x.trim().split(/\s+/).filter(Boolean).length+' '+x.length+' '+a.at(-1))}else if(c=='find'){let p=norm(a[0]||'.');out([...N.keys()].filter(k=>k==p||k.startsWith(p+'/')).join('\n'))}else if(c=='apk')await apk(a);else if(c=='curl'){let u=a.find(x=>/^https?:/.test(x)||x.startsWith('/'));if(!u)throw Error('usage
