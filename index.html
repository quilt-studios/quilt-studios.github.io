<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>POSIX.js</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#ddd;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}body{display:flex;flex-direction:column}header{height:38px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #1c1c1c;color:#888}header b{color:#eee;margin-right:10px}#term{flex:1;overflow:auto;padding:16px;white-space:pre-wrap;line-height:1.5}.line{display:flex;padding:10px 16px;border-top:1px solid #1c1c1c}.prompt{color:#55e878;margin-right:7px;white-space:nowrap}input{flex:1;background:none;border:0;outline:0;color:#eee;font:inherit}@media(max-width:600px){header{font-size:12px}#term{padding:12px}.line{padding:10px 12px}}</style></head><body><header><b>POSIX.js</b><span>browser unix · IndexedDB · riscv64</span></header><div id="term"></div><div class="line"><span class="prompt" id="prompt"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></div><script>(()=>{'use strict';const T=document.querySelector('#term'),I=document.querySelector('#cmd'),P=document.querySelector('#prompt');let cwd='/home/user',hist=[],hi=0;const nodes=new Map();const out=s=>{T.textContent+=String(s??'')+'\n';T.scrollTop=T.scrollHeight};const norm=p=>{p=p||cwd;if(p[0]=='~')p='/home/user'+p.slice(1);if(p[0]!='/')p=cwd+'/'+p;let a=[];for(const x of p.split('/')){if(!x||x=='.')continue;if(x=='..')a.pop();else a.push(x)}return'/'+a.join('/')};const prompt=()=>P.textContent='user@posixjs:'+cwd.replace('/home/user','~')+'$';function mkdir(p){p=norm(p);if(nodes.has(p))return;let q=p.split('/').slice(0,-1).join('/')||'/';if(!nodes.has(q))mkdir(q);nodes.set(p,{t:'d'})}function write(p,d){p=norm(p);mkdir(p.split('/').slice(0,-1).join('/')||'/');nodes.set(p,{t:'f',d:String(d)})}function fresh(){nodes.clear();nodes.set('/',{t:'d'});['/bin','/etc','/etc/apk','/home','/home/user','/tmp','/usr','/usr/bin','/var','/var/cache','/var/cache/apk'].forEach(mkdir);write('/etc/os-release','NAME=POSIX.js\nVERSION=4.1\nARCH=riscv64\n');write('/etc/hostname','posixjs\n');write('/etc/apk/repositories','/alpine/main\n/alpine/community\n');write('/home/user/README','POSIX.js browser userspace\nCommands: help, ls, cd, cat, echo, pwd, uname, mkdir, touch, rm, clear, apk, curl, sync\n')}const DB='posixjs4';function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('fs'))r.result.createObjectStore('fs')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function save(){let d=await db();return new Promise((ok,no)=>{let t=d.transaction('fs','readwrite');t.objectStore('fs').put([...nodes],'nodes');t.objectStore('fs').put(cwd,'cwd');t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function load(){try{let d=await db();return await new Promise((ok,no)=>{let t=d.transaction('fs'),s=t.objectStore('fs'),a=s.get('nodes'),b=s.get('cwd');t.oncomplete=()=>ok([a.result,b.result]);t.onerror=()=>no(t.error)})}catch{return null}}function list(p='.'){p=norm(p);let n=nodes.get(p);if(!n)throw Error('No such file or directory');if(n.t=='f')return[p.split('/').pop()];let pre=p=='/'?'/':p+'/';return[...new Set([...nodes.keys()].filter(k=>k.startsWith(pre)&&k!=p).map(k=>k.slice(pre.length).split('/')[0]).filter(Boolean))].sort()}async function net(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r}async function apk(a){let sub=a[0]||'help';if(sub=='update'){let repos=['main','community'],total=0,ok=0;for(const repo of repos){let url='/alpine/'+repo+'/riscv64/APKINDEX.tar.gz';out('fetch '+location.origin+url);try{let r=await net(url),b=new Uint8Array(await r.arrayBuffer());nodes.set('/var/cache/apk/'+repo+'-APKINDEX.tar.gz',{t:'b',d:b});out('OK: '+repo+' '+b.length+' bytes');total+=b.length;ok++}catch(e){out('ERROR '+repo+': '+e.message)}}if(ok==repos.length)out('OK: '+ok+' repositories, '+total+' bytes cached');else out('Mirror is not populated yet. Run/wait for the Alpine mirror workflow.');return}if(sub=='arch'){out('riscv64');return}if(sub=='repositories'){out('/alpine/main\n/alpine/community');return}out('apk: update | arch | repositories')}async function run(line){let a=line.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g)||[];a=a.map(x=>x.replace(/^['"]|['"]$/g,''));if(!a.length)return;let c=a.shift();try{if(c=='help')out('help clear pwd cd ls cat echo mkdir touch rm uname apk curl sync reboot');else if(c=='clear')T.textContent='';else if(c=='pwd')out(cwd);else if(c=='cd'){let p=norm(a[0]||'/home/user');if(nodes.get(p)?.t!='d')throw Error('not a directory');cwd=p}else if(c=='ls')out(list(a[0]||'.').join('  '));else if(c=='cat'){let n=nodes.get(norm(a[0]));if(!n)throw Error('no such file');if(n.t!='f')throw Error('not a text file');out(n.d)}else if(c=='echo')out(a.join(' '));else if(c=='mkdir'){for(const p of a)mkdir(p)}else if(c=='touch'){for(const p of a)write(p,nodes.get(norm(p))?.d||'')}else if(c=='rm'){for(let p of a){p=norm(p);for(const k of [...nodes.keys()])if(k==p||k.startsWith(p+'/'))nodes.delete(k)}}else if(c=='uname')out(a.includes('-a')?'Linux posixjs 6.6-posixjs #1 riscv64 GNU/Linux':'Linux');else if(c=='apk')await apk(a);else if(c=='curl'){let url=a.find(x=>/^https?:/.test(x)||x.startsWith('/'));if(!url)throw Error('usage: curl URL');let r=await net(url);out(await r.text())}else if(c=='sync'){await save();out('filesystem synced')}else if(c=='reboot'){await save();location.reload()}else out(c+': command not found')}catch(e){out(c+': '+e.message)}prompt()}I.addEventListener('keydown',async e=>{if(e.key=='Enter'){let s=I.value.trim();I.value='';if(s){hist.push(s);hi=hist.length;out(P.textContent+' '+s);await run(s)}}else if(e.key=='ArrowUp'){e.preventDefault();if(hi>0)I.value=hist[--hi]}else if(e.key=='ArrowDown'){e.preventDefault();if(hi<hist.length-1)I.value=hist[++hi];else{hi=hist.length;I.value=''}}});(async()=>{let x=await load();if(x?.[0]){for(const e of x[0])nodes.set(e[0],e[1]);cwd=x[1]||cwd}else fresh();out('POSIX.js 4.1');out('IndexedDB rootfs mounted');out('Alpine same-origin mirror enabled');out("Type 'help'.");prompt();I.focus()})()})();</script></body></html>
