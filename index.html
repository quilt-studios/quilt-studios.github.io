<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>POSIX.js — Browser Linux Terminal</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0b0d0e;--line:#23282c;--fg:#e6edf3;--muted:#7d8590;--green:#39ff6a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}body{display:grid;grid-template-rows:38px 1fr}
header{display:flex;align-items:center;gap:8px;padding:0 12px;background:#111;border-bottom:1px solid var(--line);font-size:12px}.dots{display:flex;gap:7px}.dot{width:11px;height:11px;border-radius:50%}.r{background:#ff5f56}.y{background:#ffbd2e}.g{background:#27c93f}.title{margin-left:8px;font-weight:700}.meta{margin-left:auto;color:var(--muted)}
main{min-height:0;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.7fr)}.shell{min-height:0;display:grid;grid-template-rows:1fr auto;border-right:1px solid var(--line)}#term{overflow:auto;padding:14px;white-space:pre-wrap;line-height:1.45;font-size:14px}.input{display:flex;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:#020202}.prompt{color:var(--green);white-space:nowrap;margin-right:8px}#cmd{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;min-width:0}
.side{min-height:0;display:grid;grid-template-rows:auto 1fr auto}.bar{display:flex;gap:7px;flex-wrap:wrap;padding:9px;border-bottom:1px solid var(--line);background:#090a0b}button{font:inherit;font-size:12px;padding:7px 9px;border-radius:7px;border:1px solid #30363d;background:#15191d;color:var(--fg)}button:hover{border-color:#58616a}.screenwrap{display:grid;place-items:center;overflow:auto;padding:10px;background:#030303}canvas{width:min(100%,900px);height:auto;aspect-ratio:4/3;background:#000;border:1px solid var(--line);image-rendering:pixelated;touch-action:none}.status{padding:8px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.running{color:var(--green)}
@media(max-width:850px){body{grid-template-rows:36px 1fr}main{grid-template-columns:1fr;grid-template-rows:minmax(58vh,1fr) 42vh}.shell{border-right:0;border-bottom:1px solid var(--line)}.meta{display:none}}
</style>
</head>
<body>
<header><div class="dots"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i></div><span class="title">user@posixjs: ~ — Terminal</span><span class="meta">POSIX.js · IndexedDB FS · /bin/sh · framebuffer/VNC · <b id="boot" class="running">BOOT</b></span></header>
<main>
<section class="shell"><div id="term"></div><div class="input"><span id="prompt" class="prompt"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus></div></section>
<section class="side"><div class="bar"><button id="bootBtn">Boot</button><button id="syncBtn">sync</button><button id="resetBtn">reset FS</button><button id="guiBtn">startx</button><button id="vncBtn">VNC WS</button></div><div class="screenwrap"><canvas id="screen" width="800" height="600" tabindex="0"></canvas></div><div id="status" class="status">TTY /dev/pts/0 · framebuffer /dev/fb0</div></section>
</main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),term=$('#term'),input=$('#cmd'),promptEl=$('#prompt'),bootEl=$('#boot'),status=$('#status'),canvas=$('#screen'),ctx=canvas.getContext('2d',{alpha:false});
let cwd='/home/user',user='user',host='posixjs',history=[],hp=0,vnc=null;const env={USER:'user',HOME:'/home/user',SHELL:'/bin/sh',PATH:'/bin:/usr/bin:/usr/local/bin',PWD:'/home/user',HOSTNAME:'posixjs'};
const stamp=()=>new Date().toISOString();
const FS={n:new Map(),norm(p){if(!p)return cwd;if(p[0]=='~')p=env.HOME+p.slice(1);if(p[0]!='/')p=cwd.replace(/\/$/,'')+'/'+p;const a=[];for(const x of p.split('/')){if(!x||x=='.')continue;if(x=='..')a.pop();else a.push(x)}return'/'+a.join('/')},par(p){p=this.norm(p);if(p=='/')return'/';let a=p.split('/');a.pop();return a.join('/')||'/'},base(p){p=this.norm(p);return p=='/'?'/':p.split('/').pop()},has(p){return this.n.has(this.norm(p))},stat(p){return this.n.get(this.norm(p))||null},mkdir(p,r=false){p=this.norm(p);if(this.has(p))return;const q=this.par(p);if(!this.has(q)){if(r)this.mkdir(q,true);else throw Error('parent does not exist: '+q)}this.n.set(p,{t:'d',m:'0755',time:stamp()})},write(p,d,app=false){p=this.norm(p);if(!this.has(this.par(p)))throw Error('no such directory');const o=this.stat(p);this.n.set(p,{t:'f',m:o?.m||'0644',time:stamp(),d:app&&o?.t=='f'?o.d+String(d):String(d)})},read(p){const n=this.stat(p);if(!n)throw Error('no such file');if(n.t!='f')throw Error('is a directory');return n.d},list(p){p=this.norm(p);const n=this.stat(p);if(!n)throw Error('no such file or directory');if(n.t=='f')return[this.base(p)];const pre=p=='/'?'/':p+'/';const s=new Set;for(const k of this.n.keys())if(k.startsWith(pre)&&k!=p){const r=k.slice(pre.length);if(r&&!r.includes('/'))s.add(r)}return[...s].sort()},rm(p,r=false){p=this.norm(p);if(p=='/')throw Error('refusing to remove /');const n=this.stat(p);if(!n)throw Error('no such file');const ch=[...this.n.keys()].filter(k=>k.startsWith(p+'/'));if(n.t=='d'&&ch.length&&!r)throw Error('directory not empty');ch.forEach(k=>this.n.delete(k));this.n.delete(p)},mv(a,b){a=this.norm(a);b=this.norm(b);const x=[...this.n.entries()].filter(([k])=>k==a||k.startsWith(a+'/'));if(!x.length)throw Error('no such file');x.forEach(([k])=>this.n.delete(k));x.forEach(([k,v])=>this.n.set(b+k.slice(a.length),{...v,time:stamp()}))},cp(a,b,r=false){a=this.norm(a);b=this.norm(b);const n=this.stat(a);if(!n)throw Error('no such file');if(n.t=='f')this.n.set(b,{...n,time:stamp()});else{if(!r)throw Error('omitting directory');this.mkdir(b,true);[...this.n.entries()].filter(([k])=>k.startsWith(a+'/')).forEach(([k,v])=>this.n.set(b+k.slice(a.length),structuredClone(v)))}}};
function fresh(){FS.n.clear();FS.n.set('/',{t:'d',m:'0755',time:stamp()});['/bin','/boot','/dev','/etc','/home','/home/user','/lib','/lib64','/media','/mnt','/opt','/proc','/root','/run','/sbin','/srv','/sys','/tmp','/usr','/usr/bin','/usr/lib','/usr/local','/usr/local/bin','/var','/var/log','/var/tmp'].forEach(x=>FS.mkdir(x,true));FS.write('/etc/hostname','posixjs\n');FS.write('/etc/os-release','NAME=POSIX.js\nID=posixjs\nPRETTY_NAME="POSIX.js Browser POSIX System"\nVERSION=1\n');FS.write('/etc/passwd','root:x:0:0:root:/root:/bin/sh\nuser:x:1000:1000:Browser User:/home/user:/bin/sh\n');FS.write('/home/user/README','POSIX.js\nType help to list commands.\n');FS.write('/home/user/demo.sh','#!/bin/sh\necho Hello from POSIX.js\nmkdir -p /tmp/demo\necho persistent-browser-filesystem > /tmp/demo/test.txt\ncat /tmp/demo/test.txt\n');FS.write('/var/log/boot.log','POSIX.js boot '+stamp()+'\n')}
const DB='posixjs-db',STORE='fs';function odb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.objectStoreNames.contains(STORE)||r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function get(k){const d=await odb();return new Promise((ok,no)=>{const r=d.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){const d=await odb();return new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function wipe(){const d=await odb();return new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).clear();t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function sync(){await put('fs',[...FS.n.entries()]);await put('state',{cwd,env});status.textContent='filesystem synced · '+new Date().toLocaleTimeString()}
function print(s=''){term.textContent+=String(s)+'\n';term.scrollTop=term.scrollHeight}function setPrompt(){env.PWD=cwd;promptEl.textContent=`${user}@${host}:${cwd.replace(env.HOME,'~')}$`}
let hook=s=>print(s);const out=(s='')=>hook(String(s));function lex(s){const a=[];let c='',q=null,e=false;for(let i=0;i<s.length;i++){const x=s[i];if(e){c+=x;e=false;continue}if(x=='\\'){e=true;continue}if(q){if(x==q)q=null;else c+=x;continue}if(x=='"'||x=="'"){q=x;continue}if(/\s/.test(x)){if(c){a.push(c);c=''}continue}if('|><;'.includes(x)){if(c){a.push(c);c=''};if((x=='>'||x=='<')&&s[i+1]==x){a.push(x+x);i++}else a.push(x);continue}c+=x}if(c)a.push(c);return a}const expand=s=>s.replace(/\$([A-Za-z_][A-Za-z0-9_]*)|\$\{([^}]+)\}/g,(_,a,b)=>env[a||b]??'');
const C={};function add(n,fn,h){C[n]={fn,h}};
add('help',()=>{out('POSIX.js commands:');Object.keys(C).sort().forEach(n=>out('  '+n.padEnd(11)+(C[n].h||'')));out('\nShell: |  >  >>  <  ;  $VARS  .sh')},'show help');add('pwd',()=>out(cwd),'working directory');add('whoami',()=>out(user),'current user');add('hostname',()=>out(host),'hostname');add('clear',()=>term.textContent='','clear terminal');add('echo',a=>out(a.join(' ')),'print text');add('date',()=>out(new Date().toString()),'date/time');add('uname',a=>out(a.includes('-a')?'POSIX.js posixjs 1.0 browser-js GNU/POSIX':'POSIX.js'),'system info');add('id',()=>out('uid=1000(user) gid=100(users) groups=100(users)'),'identity');add('env',()=>Object.keys(env).sort().forEach(k=>out(k+'='+env[k])),'environment');add('export',a=>a.forEach(x=>{const i=x.indexOf('=');if(i>0)env[x.slice(0,i)]=x.slice(i+1)}),'set variable');add('cd',a=>{const p=FS.norm(a[0]||env.HOME),n=FS.stat(p);if(!n||n.t!='d')throw Error('cd: no such directory');cwd=p;setPrompt()},'change directory');
add('ls',a=>{const long=a.includes('-l'),p=a.filter(x=>!x.startsWith('-'))[0]||cwd,n=FS.stat(p);if(!n)throw Error('ls: not found');if(n.t=='f')return out(FS.base(p));const names=FS.list(p);if(!long)return out(names.join('  '));names.forEach(x=>{const q=(FS.norm(p)=='/'?'':FS.norm(p))+'/'+x,s=FS.stat(q);out(`${s.t=='d'?'d':'-'}${s.m} 1 user users ${s.t=='f'?s.d.length:0} ${x}`)})},'list files');add('mkdir',a=>{const r=a.includes('-p');a.filter(x=>!x.startsWith('-')).forEach(x=>FS.mkdir(x,r))},'make directory');add('touch',a=>a.forEach(x=>FS.has(x)?FS.stat(x).time=stamp():FS.write(x,'')),'create file');add('cat',a=>a.forEach(x=>out(FS.read(x).replace(/\n$/,''))),'print file');add('head',a=>{const p=a[a.length-1],n=parseInt(a[a.indexOf('-n')+1]||'10');out(FS.read(p).split('\n').slice(0,n).join('\n'))},'first lines');add('tail',a=>{const p=a[a.length-1],n=parseInt(a[a.indexOf('-n')+1]||'10');out(FS.read(p).split('\n').slice(-n).join('\n'))},'last lines');add('rm',a=>{const r=a.includes('-r')||a.includes('-R');a.filter(x=>!x.startsWith('-')).forEach(x=>FS.rm(x,r))},'remove');add('rmdir',a=>a.forEach(x=>FS.rm(x,false)),'remove empty dir');add('cp',a=>{const r=a.includes('-r')||a.includes('-R'),x=a.filter(v=>!v.startsWith('-'));FS.cp(x[0],x[1],r)},'copy');add('mv',a=>FS.mv(a[0],a[1]),'move');add('stat',a=>{const n=FS.stat(a[0]);if(!n)throw Error('not found');out(`File: ${FS.norm(a[0])}\nType: ${n.t=='d'?'directory':'file'}\nMode: ${n.m}\nModify: ${n.time}\nSize: ${n.t=='f'?n.d.length:0}`)},'file status');add('chmod',a=>{const n=FS.stat(a[1]);if(!n)throw Error('not found');n.m=a[0]},'change mode');add('find',a=>{const r=FS.norm(a[0]||cwd);[...FS.n.keys()].sort().filter(k=>k==r||k.startsWith(r+'/')).forEach(out)},'find files');add('grep',a=>{const p=a[a.length-1],pat=a.filter(x=>!x.startsWith('-'))[0],re=new RegExp(pat);FS.read(p).split('\n').forEach((l,i)=>{if(re.test(l))out((a.includes('-n')?i+1+':':'')+l)})},'search text');add('wc',a=>{const p=a[a.length-1],s=FS.read(p);out(`${s.split('\n').length-(s.endsWith('\n')?1:0)} ${(s.match(/\S+/g)||[]).length} ${s.length} ${p}`)},'count');add('sort',a=>out(FS.read(a[a.length-1]).split('\n').sort().join('\n')),'sort');add('basename',a=>out(FS.base(a[0])),'basename');add('dirname',a=>out(FS.par(a[0])),'dirname');add('which',a=>a.forEach(n=>out(C[n]?'/bin/'+n:`${n} not found`)),'locate command');add('ps',()=>out('PID TTY   STAT CMD\n1   pts/0 S    /bin/sh\n2   pts/0 R    ps'),'process list');add('df',()=>out('Filesystem      Size     Used Avail Mounted on\nindexeddbfs     browser  --   --    /\ntmpfs           memory   --   --    /tmp'),'disk usage');add('mount',()=>out('indexeddbfs on / type idbfs (rw,persistent)\nproc on /proc type proc (ro,simulated)\nsysfs on /sys type sysfs (ro,simulated)'),'mounts');add('free',()=>out('Mem: browser-managed'),'memory');add('dmesg',()=>out(FS.read('/var/log/boot.log').trim()),'boot log');add('history',()=>history.forEach((x,i)=>out(`${i+1}  ${x}`)),'history');add('sync',async()=>{await sync();out('filesystem synced')},'sync FS');add('reboot',async()=>boot(),'reboot');add('shutdown',async()=>{await sync();out('System halted. Press Boot.');bootEl.textContent='HALTED'},'halt');add('nano',a=>edit(a[0]||'untitled.txt'),'simple editor');add('vi',a=>edit(a[0]||'untitled.txt'),'simple editor');add('sh',async a=>script(a[0]),'run .sh');add('bash',async a=>script(a[0]),'shell subset');
function edit(p){const t=prompt('Edit '+FS.norm(p),FS.has(p)?FS.read(p):'');if(t!==null)FS.write(p,t)}async function script(p){for(let l of FS.read(p).split(/\r?\n/)){l=l.trim();if(!l||l[0]=='#')continue;await line(l)}}
async function one(t,stdin=''){if(!t.length)return'';t=t.map(expand);const n=t.shift();if(n.includes('=')&&!n.includes('/')){const i=n.indexOf('=');env[n.slice(0,i)]=n.slice(i+1);return''}if((n.endsWith('.sh')||n.includes('/'))&&FS.has(n)){await script(n);return''}if(!C[n])throw Error(n+': command not found');let b='',old=hook;hook=s=>b+=String(s)+'\n';env.STDIN=stdin;try{await C[n].fn(t)}finally{hook=old}return b}async function pipe(tokens){let seg=[],all=[];tokens.forEach(t=>{if(t=='|'){all.push(seg);seg=[]}else seg.push(t)});all.push(seg);let data='';for(let s of all){let f=null,app=false,clean=[];for(let i=0;i<s.length;i++){if(s[i]=='>'||s[i]=='>>'){app=s[i]=='>>';f=s[++i]}else clean.push(s[i])}data=await one(clean,data);if(f){FS.write(f,data,app);data=''}}if(data)print(data.replace(/\n$/,''))}async function line(s){for(const g of s.split(';')){const t=lex(g.trim());if(!t.length)continue;try{await pipe(t)}catch(e){print('sh: '+e.message)}}await sync()}
function desktop(){ctx.fillStyle='#080b0d';ctx.fillRect(0,0,800,600);ctx.fillStyle='#e6edf3';ctx.font='28px monospace';ctx.fillText('POSIX.js framebuffer',35,55);ctx.fillStyle='#39ff6a';ctx.font='17px monospace';ctx.fillText('/dev/fb0 · browser canvas display',35,88);ctx.strokeStyle='#30363d';ctx.strokeRect(35,125,730,390);ctx.fillStyle='#9da7b1';['Display: 800x600 RGBA','Input: mouse + keyboard','VNC: WebSocket gateway','Filesystem: IndexedDB persistent','','Use startx for GUI demo.'].forEach((x,i)=>ctx.fillText(x,60,170+i*29))}function startx(){desktop();ctx.fillStyle='#ddd';ctx.fillRect(150,160,500,290);ctx.fillStyle='#222';ctx.fillRect(150,160,500,36);ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.fillText('POSIX.js Desktop',170,184);ctx.fillStyle='#111';ctx.font='20px monospace';ctx.fillText('Hello from X/Framebuffer',190,250)}
function connect(){const u=prompt('WebSocket VNC/framebuffer gateway URL','ws://localhost:6080/');if(!u)return;try{vnc?.close();vnc=new WebSocket(u);vnc.binaryType='arraybuffer';vnc.onopen=()=>status.textContent='VNC websocket connected';vnc.onclose=()=>status.textContent='VNC disconnected';vnc.onerror=()=>status.textContent='VNC websocket error';vnc.onmessage=e=>{if(typeof e.data=='string'){try{const m=JSON.parse(e.data);if(m.type=='rect'){ctx.fillStyle=m.color||'#000';ctx.fillRect(m.x,m.y,m.w,m.h)}}catch{}}else{const b=new Uint8Array(e.data);if(b.length>=4){const w=(b[0]<<8)|b[1],h=(b[2]<<8)|b[3];if(b.length>=4+w*h*4)ctx.putImageData(new ImageData(new Uint8ClampedArray(b.buffer,4,w*h*4),w,h),0,0)}}}}catch(e){status.textContent='VNC error: '+e.message}}
canvas.addEventListener('keydown',e=>{if(vnc?.readyState==1)vnc.send(JSON.stringify({type:'key',key:e.key,code:e.code,down:true}))});canvas.addEventListener('pointerdown',e=>{canvas.focus();if(vnc?.readyState==1)vnc.send(JSON.stringify({type:'pointer',x:e.offsetX,y:e.offsetY,buttons:e.buttons}))});
async function boot(){bootEl.textContent='BOOTING';term.textContent='';print('POSIX.js GNU/POSIX browser environment');print('[ OK ] Mounting IndexedDB filesystem');const f=await get('fs');if(f)FS.n=new Map(f);else{fresh();await sync()}const s=await get('state');if(s){cwd=s.cwd||cwd;Object.assign(env,s.env||{})}setPrompt();print('[ OK ] Mounted / /home /etc /mnt /proc /sys /dev');print('[ OK ] Started /bin/sh');print("Last login: browser session\nType 'help' for commands.");bootEl.textContent='RUNNING';desktop();input.focus()}
input.addEventListener('keydown',async e=>{if(e.key=='Enter'){const s=input.value;input.value='';if(s.trim()){history.push(s);hp=history.length;print(promptEl.textContent+' '+s);await line(s)}setPrompt()}else if(e.key=='ArrowUp'){e.preventDefault();if(hp>0)input.value=history[--hp]||''}else if(e.key=='ArrowDown'){e.preventDefault();if(hp<history.length-1)input.value=history[++hp]||'';else{hp=history.length;input.value=''}}else if(e.key=='Tab'){e.preventDefault();const p=input.value.split(/\s/).pop(),o=Object.keys(C).filter(x=>x.startsWith(p));if(o.length==1)input.value=input.value.slice(0,-p.length)+o[0];else if(o.length>1)print(o.join('  '))}});
$('#bootBtn').onclick=boot;$('#syncBtn').onclick=sync;$('#resetBtn').onclick=async()=>{if(confirm('Delete persistent POSIX.js filesystem?')){await wipe();fresh();await sync();await boot()}};$('#guiBtn').onclick=startx;$('#vncBtn').onclick=connect;window.POSIXJS={FS,commands:C,run:line,sync,boot};boot();
})();
</script>
