<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>POSIX.js</title>
  <link rel="stylesheet" href="/css/terminal.css">
</head>
<body>
  <div id="task-status" class="task-status" hidden>
    <div class="task-head">
      <strong id="task-title">Working…</strong>
      <span id="task-pct">0%</span>
    </div>
    <div id="task-detail" class="task-detail"></div>
    <div class="task-track"><div id="task-bar" class="task-bar"></div></div>
  </div>

  <div id="o"></div>
  <div class="i">
    <span class="p" id="p"></span>
    <input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
  </div>

  <script src="/lib/rv64exec.js"></script>
  <script src="/lib/posix-core.js"></script>
  <script src="/lib/progress.js"></script>
  <script src="/lib/apk.js"></script>
  <script src="/lib/systemd.js"></script>
  <script src="/lib/wayland.js"></script>
  <script src="/lib/uide.js"></script>
  <script src="/lib/shell.js"></script>
</body>
</html>
