name: Update Alpine mirror

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */5 * * *'
    # 15:30 Europe/Vienna: 13:30 UTC in CEST, 14:30 UTC in CET.
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: alpine-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Vienna 15:30 schedule
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.schedule }}" = "30 13 * * *" ] || [ "${{ github.event.schedule }}" = "30 14 * * *" ]; then
            NOW=$(TZ=Europe/Vienna date +%H:%M)
            if [ "$NOW" != "15:30" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Download Alpine riscv64 indexes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://dl-cdn.alpinelinux.org/alpine/latest-stable
          ARCH=riscv64
          for repo in main community; do
            mkdir -p "alpine/$repo/$ARCH"
            curl --fail --location --retry 3 --retry-delay 2 "$BASE/$repo/$ARCH/APKINDEX.tar.gz" -o "alpine/$repo/$ARCH/APKINDEX.tar.gz"
          done
          date -u +%FT%TZ > alpine/last-update.txt
      - name: Commit mirror
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add alpine
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Alpine riscv64 mirror'
          git push
