name: Update Alpine mirror

on:
  workflow_dispatch:
  push:
    paths:
      - 'alpine/rebuild.trigger'
  schedule:
    - cron: '17 */5 * * *'
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'

permissions:
  contents: write

concurrency:
  group: alpine-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Vienna 15:30 schedule
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.schedule }}" = "30 13 * * *" ] || [ "${{ github.event.schedule }}" = "30 14 * * *" ]; then
            [ "$(TZ=Europe/Vienna date +%H:%M)" = "15:30" ] || { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Build Alpine riscv64 mirror
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://dl-cdn.alpinelinux.org/alpine/latest-stable
          ARCH=riscv64
          rm -rf alpine/main/$ARCH alpine/community/$ARCH
          mkdir -p alpine/main/$ARCH alpine/community/$ARCH
          : > alpine/packages.tsv
          for repo in main community; do
            dir="alpine/$repo/$ARCH"
            curl -fL --retry 3 "$BASE/$repo/$ARCH/APKINDEX.tar.gz" -o "$dir/APKINDEX.tar.gz"
            tar -xOzf "$dir/APKINDEX.tar.gz" APKINDEX > "/tmp/$repo.index"
          done

          WANT="musl busybox busybox-binsh alpine-baselayout alpine-baselayout-data alpine-keys ssl_client ca-certificates ca-certificates-bundle libcrypto3 libssl3 zlib scanelf musl-utils"
          for pkg in $WANT; do
            found=0
            for repo in main community; do
              idx="/tmp/$repo.index"
              ver=$(awk -v p="$pkg" 'BEGIN{RS="";FS="\n"} $0 ~ "(^|\\n)P:"p"(\\n|$)" {for(i=1;i<=NF;i++)if($i~/^V:/){sub(/^V:/,"",$i);print $i;exit}}' "$idx")
              if [ -n "$ver" ]; then
                apkfile="$pkg-$ver.apk"
                browserfile="$pkg-$ver.browser.tar.gz"
                echo "mirror $repo/$apkfile -> $browserfile"
                curl -fL --retry 3 "$BASE/$repo/$ARCH/$apkfile" -o "/tmp/$apkfile"
                python3 - "/tmp/$apkfile" "alpine/$repo/$ARCH/$browserfile" <<'PY'
import gzip, io, os, sys, tarfile
src, dst = sys.argv[1], sys.argv[2]
raw = open(src, 'rb').read()
entries = []
# Python gzip transparently consumes concatenated APK gzip members. The result
# contains consecutive tar archives (signature/control/data). Walk every tar
# segment and rebuild one clean tar.gz that browsers can unpack in one pass.
payload = gzip.decompress(raw)
off = 0
while off + 512 <= len(payload):
    while off + 512 <= len(payload) and payload[off:off+512] == b'\0' * 512:
        off += 512
    if off + 512 > len(payload): break
    try:
        tf = tarfile.open(fileobj=io.BytesIO(payload[off:]), mode='r:')
        members = tf.getmembers()
        if not members: break
        for m in members:
            if m.name.startswith('.SIGN.') or m.name == '.PKGINFO':
                continue
            data = None
            if m.isfile():
                f = tf.extractfile(m)
                data = f.read() if f else b''
            entries.append((m, data))
        # Find archive end manually from member offsets, rounded to 512 plus
        # the two tar EOF blocks. This allows continuing to the next APK member.
        end = 0
        for m in members:
            size = (m.size + 511) // 512 * 512
            end = max(end, m.offset_data + size)
        off += end + 1024
    except tarfile.TarError:
        break
os.makedirs(os.path.dirname(dst), exist_ok=True)
with tarfile.open(dst, 'w:gz', format=tarfile.PAX_FORMAT) as out:
    for m, data in entries:
        m.name = m.name.lstrip('./')
        if not m.name:
            continue
        if m.isfile():
            out.addfile(m, io.BytesIO(data or b''))
        else:
            out.addfile(m)
print(f'normalized {len(entries)} entries -> {dst}')
PY
                test -s "alpine/$repo/$ARCH/$browserfile"
                printf '%s\t%s\t%s\t%s\n' "$pkg" "$ver" "$repo" "$browserfile" >> alpine/packages.tsv
                rm -f "/tmp/$apkfile"
                found=1
                break
              fi
            done
            [ "$found" = 1 ] || echo "warning: $pkg not found"
          done
          date -u +%FT%TZ > alpine/last-update.txt
      - name: Commit mirror
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A alpine
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update installable Alpine riscv64 mirror'
          git push
